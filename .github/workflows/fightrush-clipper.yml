name: FightRush Clipper Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/fightrush-clipper/**"
      - ".github/workflows/fightrush-clipper.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AppFactory
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: apps/fightrush-clipper
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FightRush-Clipper-debug-APK
          path: apps/fightrush-clipper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK download on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fightrush-build-${{ github.run_number }}
          name: FightRush Clipper Studio build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: apps/fightrush-clipper/app/build/outputs/apk/debug/app-debug.apk
